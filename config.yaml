# =============================================================================
# Central path configuration for the actreg repo.
#
# This is the single source of truth for filesystem locations. It is consumed by
# `paths.py` (Python) and can be sourced indirectly in shell via that loader.
#
# - `repo_root` is auto-detected by paths.py (the directory containing config.yaml);
#   do not hardcode it here.
# - Paths that do NOT start with "/" are interpreted as RELATIVE to repo_root.
# - Every key can be overridden at runtime by the matching UPPERCASE environment
#   variable, e.g. `SAILS_DATA_ROOT=/x python ...` overrides `sails_data_root`.
#
# When migrating to a new machine, you typically only need to edit the four
# "External data roots" below.
# =============================================================================

# --- External data roots (machine-specific; most likely to change) -----------
# NOTE: the shared SAILS data was migrated OFF the soon-to-be-purged scratch
# (/orcd/scratch/bcs/001/sensein/sails) INTO the durable lab project space below.
# The lab copy mirrors scratch 1:1 (verified for rmm/features + classification_clips
# + cache_for_tracking + feature_processing/pipeline_outputs).
sails_data_root: /orcd/data/satra/002/projects/SAILS   # shared SAILS data (lab durable space)
models_root:      /orcd/data/satra/002/models          # pretrained mmpose / mmdet weights
dataset_root:     /orcd/data/satra/002/datasets/SAILS  # raw SAILS dataset

# --- Derived shared-data locations (absolute, under the lab project space) ---
rmm_features:                 /orcd/data/satra/002/projects/SAILS/rmm/features
classification_clips:         /orcd/data/satra/002/projects/SAILS/rmm/classification_clips
# NOTE: OUTPUT-ONLY. This is the (optional) crop-export target of
# dataprep/clip_gen/create_clip_segments.py; no training/eval/extract step READS it.
# V-JEPA cropping is done live from `classification_clips` + the `cache_for_tracking`
# SAM3 mask cache (see v-jepa/slurm/run_vjepa_*.sh --enable-crop). Absent everywhere and
# NOT required to reproduce any result; regenerable from clips + SAM3 masks if ever wanted.
classification_clips_cropped: /orcd/data/satra/002/projects/SAILS/rmm/classification_clips_cropped
cache_for_tracking:           /orcd/data/satra/002/projects/SAILS/cache_for_tracking
pipeline_outputs:             /orcd/data/satra/002/projects/SAILS/feature_processing/pipeline_outputs
vjepa2_finetune_clips:        /orcd/data/satra/002/projects/SAILS/rmm/vjepa2_finetune_clips
rmm_sam_numbered:             /orcd/data/satra/002/projects/SAILS/rmm/rmm_sam_numbered
rmm_numbered_target:          /orcd/data/satra/002/projects/SAILS/rmm/rmm_numbered_target
# NOTE: absent (not present in the lab mirror), but only a FALLBACK. It is referenced solely as the argparse
# default `--videos-root` in v-jepa/tools/extract_vjepa_features.py, which resolves each
# clip from the window-split CSV's absolute `video_path` (under `dataset_root`/Phase_III_Videos,
# which EXISTS) and only falls back to this dir when a row lacks `video_path`. Since the
# CSVs carry absolute paths, this dir is not needed; features are also already pre-extracted.
rmm_videos:                   /orcd/data/satra/002/projects/SAILS/rmm/videos
# Windowed-TAL clips (Track 1), migrated from personal scratch into the lab space.
tal_clips_root:               /orcd/data/satra/002/projects/SAILS/rmm/tal_windows_4class/canonical_clips

# --- In-repo input locations (relative to repo_root; tracked in git) ---------
splits:       dataprep/splits
tal_splits:   dataprep/tal

# --- In-repo output roots (relative to repo_root; git-ignored artifacts) -----
vjepa_runs:      v-jepa/runs
pyskl_work_dirs: pyskl/work_dirs
opentad_exps:    OpenTAD/exps/sails_rmm
fusion_runs:     fusion/runs

# --- Shared, durable copy of the reported-result checkpoints -----------------
# The output roots above hold the trained weights, but they are git-ignored and
# live only in this personal working tree (NOT on GitHub). A ~24 GB lean copy of
# just the reported-result finals (OpenTAD best.pth + result_detection.json,
# V-JEPA2 model.safetensors, pyskl best_*.pth, fusion MLPs) is mirrored to the
# shared lab project space below, using the SAME repo-relative layout inside.
# To reproduce results from a fresh clone, overlay it into the working tree:
#     rsync -a "$(python paths.py --get checkpoints_root)"/ .
checkpoints_root: /orcd/data/satra/002/projects/SAILS/checkpoints

# --- Frequently-referenced concrete checkpoints (relative to repo_root) ------
# The 4-class V-JEPA2 classifier used as the default two-stage Stage-2 model.
vjepa_4class_ckpt: v-jepa/runs/vjepa2_rmm_cv/f64_lr1e-5_bs1_acc8_ep20_crop_4cls
